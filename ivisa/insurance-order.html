    body::-webkit-scrollbar { width: 14px; }
    body::-webkit-scrollbar-track { background: transparent; }
    body::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.45);
      border-radius: 8px;
    }
    html, body { margin: 0; }
    body {
      height: 100%;
      overflow-y: scroll;
      scrollbar-color: rgba(255,255,255,0.45) transparent;
      font-family: var(--font);
      color: var(--ink);
      background: transparent;
      font-size: 14px;
      line-height: 1.45;
    }
    button, input, select { font: inherit; }
    a { color: var(--blue); }
    .proto-desk { background: #f4f6f9; color: #334c6f; }
    .proto-note {
      background: #cdd9dc;
      color: #2a4044;
      padding: 12px 16px 14px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 12px 36px;
    }
    .proto-note .proto-axis:last-child {
      margin-left: 8px;
    }
    .proto-panel {
      padding: 12px 16px 14px;
      display: grid;
      gap: 12px;
    }
    .proto-axis { display: grid; gap: 6px; }
    .proto-axis b { font-size: 13px; }
    .proto-axis .hint {
      margin: 0;
      font-size: 12px;
      color: #5c6d86;
    }
    .proto-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .proto-chips label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: #fff;
      color: #2a4044;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .proto-chips label:has(input:checked) {
      background: #fff;
      box-shadow: none;
    }
    .proto-chips input { accent-color: #007bff; margin: 0; }
    .proto-axis.is-off .proto-chips { opacity: 0.45; }
    .proto-axis.is-off label { cursor: not-allowed; }
    .page { max-width: 920px; margin: 0 auto; padding: 28px 16px 80px; }
    @media (min-width: 768px) {
      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 268px;
        align-items: start;
      }
      .page {
        grid-column: 1;
        grid-row: 1;
        width: 100%;
      }
      .proto-desk {
        grid-column: 2;
        grid-row: 1;
        position: sticky;
        top: 12px;
        width: auto;
        background: transparent;
        padding: 12px 12px 24px 0;
      }
      .proto-note {
        flex-direction: column;
        gap: 14px;
        max-width: none;
        margin: 0;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(42, 64, 68, 0.2);
      }
      .proto-note .proto-axis:last-child { margin-left: 0; }
      .proto-chips { flex-direction: column; }
    }

<body>
  <div class="proto-desk">
    <div class="proto-note">
      <div class="proto-axis">
        <b>Где показываем страховку&nbsp;— в&nbsp;каком месте заказа человек её&nbsp;видит</b>
        <div class="proto-chips" id="bar-scenario" role="radiogroup" aria-label="Где показываем страховку">
          <label><input type="radio" name="proto-place" value="a" checked /> Вместе с&nbsp;приглашением</label>
          <label><input type="radio" name="proto-place" value="b" /> После оплаты</label>
          <label><input type="radio" name="proto-place" value="c" /> Отдельная страница</label>
        </div>
      </div>
      <div class="proto-axis is-off" id="axis-plans">
        <b>Как выглядит выбор полиса&nbsp;— кнопки активны на&nbsp;экранах с&nbsp;выбором полиса</b>
        <div class="proto-chips" id="bar-plans" role="radiogroup" aria-label="Какой вид тарифов" aria-disabled="true">
          <label><input type="radio" name="proto-grid" value="cards" checked disabled /> Три карточки</label>
          <label><input type="radio" name="proto-grid" value="addons" disabled /> Полис и&nbsp;опции</label>
          <label><input type="radio" name="proto-grid" value="list" disabled /> Список</label>
          <label><input type="radio" name="proto-grid" value="offer" disabled /> Без выбора, один полис</label>
        </div>
      </div>
    </div>
  </div>

  <div class="page">
    <div id="app"></div>
  </div>

  <script>
    const INVITE = 29;
    const PLANS = [
      { id: 'std', name: 'Standard', cover: '€\u202F35,000', price: 12, tag: 'Visa minimum', items: ['Emergency medical care', 'Hospital', 'Dental emergency', 'Repatriation'] },
      { id: 'com', name: 'Comfort', cover: '€\u202F50,000', price: 18, tag: 'Best offer', items: ['Higher medical limit', 'Chronic flare-up', 'Prescribed medicines', 'Doctor call to hotel'] },
      { id: 'plus', name: 'Plus', cover: '€\u202F100,000', price: 27, tag: 'Maximum cover', items: ['€\u202F100,000 medical limit', 'Luggage', 'Delayed flight', 'Civil liability'] }
    ];
    const icCal = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="2" stroke="#334c6f" stroke-width="1.6"/><path d="M3 8h14M7 2.5v3M13 2.5v3" stroke="#334c6f" stroke-width="1.6" stroke-linecap="round"/></svg>';
    const icMail = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="10" rx="1.5" stroke="#334c6f" stroke-width="1.6"/><path d="M4 6.5 10 11l6-4.5" stroke="#334c6f" stroke-width="1.6" stroke-linecap="round"/></svg>';
    const icUser = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="#334c6f" stroke-width="1.6"/><path d="M4.5 16c1.2-3 9.8-3 11 0" stroke="#334c6f" stroke-width="1.6" stroke-linecap="round"/></svg>';
    const icShield = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2.5 16 5v4.8c0 3.7-2.4 6.2-6 7.7-3.6-1.5-6-4-6-7.7V5l6-2.5Z" stroke="#334c6f" stroke-width="1.6" stroke-linejoin="round"/><path d="m7.5 10 1.8 1.8 3.4-3.6" stroke="#334c6f" stroke-width="1.6" stroke-linecap="round"/></svg>';
    const state = {
      scenario: 'a',
      screen: 'info',
      plan: 'com',
      planUi: 'cards',
      sport: false,
      luggage: false,
      delay: false,
      skip: false,
      paidInvite: false,
      paidIns: false,
      firstName: 'James',
      lastName: 'Walker',
      birth: '1994-03-12',
      passport: 'PA1234567',
      email: 'james.walker@email.com',
      entry: '2026-11-12',
      exit: '2026-11-22',
      calOpen: false,
      calTarget: 'entry',
      viewY: 2026,
      viewM: 10,
      errors: {}
    };

    const $ = (html) => html;
    const money = (n) => '$' + n;
    function fmt(iso) {
      return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function stayDays() {
      const a = new Date(state.entry + 'T00:00:00');
      const b = new Date(state.exit + 'T00:00:00');
      return Math.round((b - a) / 86400000) + 1;
    }
    function stayLine() {
      return fmt(state.entry) + '\u00A0— ' + fmt(state.exit);
    }
    const insPrice = () => {
      if (state.skip) return 0;
      if (state.planUi === 'addons' || state.planUi === 'offer') {
        return 18 + (state.sport ? 4 : 0) + (state.luggage ? 6 : 0) + (state.delay ? 5 : 0);
      }
      const p = PLANS.find((x) => x.id === state.plan);
      return p.price + (state.sport ? 4 : 0);
    };
    const total = () => {
      if (state.scenario === 'c') return insPrice();
      if (state.scenario === 'b' && state.paidInvite) return insPrice();
      return INVITE + insPrice();
    };

    function steps(labels, active) {
      return `<div class="steps">${labels.map((l, i) => {
        const item = `<div class="item${i === active ? ' is-on' : ''}">${l}</div>`;
        return i < labels.length - 1 ? item + '<div class="arrow">›</div>' : item;
      }).join('')}</div>`;
    }

    function actions(back, next, nextId) {
      return `<div class="actions">
        ${back ? `<button type="button" class="btn ghost" data-go="${back.label}">${back.text}</button>` : '<div></div>'}
        ${next ? `<button type="button" class="btn" id="${nextId || 'next'}" data-go="${next.label}">${next.text}</button>` : ''}
      </div>`;
    }

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const WEEK = ['Mo','Tu','We','Th','Fr','Sa','Su'];
    const TODAY = '2026-10-30';
    function pad(n) { return String(n).padStart(2, '0'); }
    function isoYMD(y, m, d) {
      const dt = new Date(y, m, d);
      return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
    }
    function parseISO(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function fmtDot(iso) {
      const d = parseISO(iso);
      return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
    }
    function calIcon() {
      return `<span class="cal-ic">${'<i></i>'.repeat(9)}</span>`;
    }
    function monthCells(y, m) {
      const first = new Date(y, m, 1);
      let start = first.getDay();
      start = start === 0 ? 6 : start - 1;
      const daysIn = new Date(y, m + 1, 0).getDate();
      const prevIn = new Date(y, m, 0).getDate();
      const cells = [];
      for (let i = 0; i < 42; i++) {
        const d = i - start + 1;
        if (d < 1) cells.push({ iso: isoYMD(y, m, d), day: prevIn + d, out: true });
        else if (d > daysIn) cells.push({ iso: isoYMD(y, m, d), day: d - daysIn, out: true });
        else cells.push({ iso: isoYMD(y, m, d), day: d, out: false });
      }
      return cells;
    }
    function dualCal() {
      if (!state.calOpen) return '';
      const left = { y: state.viewY, m: state.viewM };
      const right = state.viewM === 11 ? { y: state.viewY + 1, m: 0 } : { y: state.viewY, m: state.viewM + 1 };
      const years = [2026, 2027, 2028, 2029, 2030, 2031];
      function pane(cal, idx) {
        const head = idx === 0
          ? `<button type="button" class="dp-nav" data-shift="-1" aria-label="Previous month">‹</button>
             <select data-year>${years.map((y) => `<option value="${y}"${y === cal.y ? ' selected' : ''}>${y}</option>`).join('')}</select>
             <select data-month>${MONTHS.map((name, i) => `<option value="${i}"${i === cal.m ? ' selected' : ''}>${name}</option>`).join('')}</select>`
          : `<div class="dp-title">${cal.y} ${MONTHS[cal.m]}</div>
             <button type="button" class="dp-nav" data-shift="1" aria-label="Next month">›</button>`;
        const cells = monthCells(cal.y, cal.m).map((c) => {
          const disabled = c.iso < TODAY;
          const on = c.iso === state.entry || c.iso === state.exit;
          const between = c.iso > state.entry && c.iso < state.exit;
          const today = c.iso === TODAY;
          const cls = ['dp-day', c.out ? 'is-out' : '', on ? 'is-on' : '', between ? 'is-between' : '', today && !on ? 'is-today' : ''].filter(Boolean).join(' ');
          return `<button type="button" class="${cls}" data-day="${c.iso}" ${disabled ? 'disabled' : ''}>${c.day}</button>`;
        }).join('');
        return `<div class="dp-col">
          <div class="dp-head">${head}</div>
          <div class="dp-week">${WEEK.map((w) => `<span>${w}</span>`).join('')}</div>
          <div class="dp-grid">${cells}</div>
        </div>`;
      }
      return `<div class="dp" id="dual-cal">${pane(left, 0)}${pane(right, 1)}</div>`;
    }
    function tripBar(action) {
      return `<div class="trip-wrap">
        <div class="trip">
          <button type="button" class="trip-date" data-cal="entry">
            <span>When</span><strong>${fmtDot(state.entry)}</strong>${calIcon()}
          </button>
          <button type="button" class="trip-date" data-cal="exit">
            <span>Until</span><strong>${fmtDot(state.exit)}</strong>${calIcon()}
          </button>
          <label><span>Tourists</span><strong>1\u00A0traveler · 32\u00A0years</strong></label>
          ${action ? `<button type="button" class="btn search" data-go="${action}">Search</button>` : '<div></div>'}
        </div>
        ${dualCal()}
        <input type="hidden" id="entry" value="${state.entry}" />
        <input type="hidden" id="exit" value="${state.exit}" />
      </div>`;
    }
    function tripChips() {
      return `<div class="facts">
        <span><small>Destination</small>Russia, ${stayDays()}\u00A0days</span>
        <span><small>Dates</small>${stayLine()}</span>
        <span><small>Travelers</small>1\u00A0person</span>
      </div>`;
    }
    function extras() {
      return `<div class="opt">
        <label><input type="checkbox" id="sport" ${state.sport ? 'checked' : ''} /> Sports and outdoor activities</label>
        <b>+$4</b>
      </div>
      ${state.planUi === 'addons' || state.planUi === 'offer' ? `
      <div class="opt">
        <label><input type="checkbox" id="luggage" ${state.luggage ? 'checked' : ''} /> Luggage</label>
        <b>+$6</b>
      </div>
      <div class="opt">
        <label><input type="checkbox" id="delay" ${state.delay ? 'checked' : ''} /> Delayed flight</label>
        <b>+$5</b>
      </div>` : ''}`;
    }
    function planList() {
      const insurer = `<div class="insurer"><div class="mark">SC</div><div><strong>Sovcombank Insurance</strong><div>Electronic policy in English, PDF to email</div></div></div>`;
      if (state.planUi === 'list') {
        return insurer + `<div class="plist">${PLANS.map((p) => `
          <label class="${state.plan === p.id ? 'is-on' : ''}">
            <input type="radio" name="plan" value="${p.id}" ${state.plan === p.id ? 'checked' : ''} />
            <div><b>${p.name}</b> · ${p.cover}<div>${p.items[0]}</div></div>
            <div class="price">${money(p.price)}</div>
          </label>`).join('')}</div>` + extras();
      }
      if (state.planUi === 'addons') {
        return insurer + `<div class="offer">
          <span class="tag">Recommended for a visa</span>
          <div class="name">Comfort · €\u202F50,000</div>
          <div class="price">${money(insPrice())}</div>
          <ul><li>Emergency medical care and hospital</li><li>Chronic flare-up and medicines</li><li>Doctor call to hotel</li><li>Repatriation</li></ul>
        </div>` + extras();
      }
      if (state.planUi === 'offer') {
        return `<div class="offer">
          <div class="insurer"><div class="mark">SC</div><div><strong>Sovcombank Insurance</strong><div>The best offer for your dates</div></div></div>
          <div class="price">${money(insPrice())}</div>
          <div>Cover €\u202F50,000 · ${stayDays()}\u00A0days in Russia</div>
          <ul><li>Medical care accepted for a visa application</li><li>Hospital, dental emergency, repatriation</li><li>Policy PDF in English, same day</li></ul>
        </div>` + extras();
      }
      return insurer + `<div class="plans">${PLANS.map((p) => `
        <label class="plan${state.plan === p.id ? ' is-on' : ''}">
          <input type="radio" name="plan" value="${p.id}" ${state.plan === p.id ? 'checked' : ''} />
          <span class="tag">${p.tag}</span>
          <div class="name">${p.name}</div>
          <div class="cover">Cover <b>${p.cover}</b></div>
          <ul>${p.items.map((i) => `<li>${i}</li>`).join('')}</ul>
          <div class="price">${money(p.price)}</div>
        </label>`).join('')}
      </div>` + extras();
    }

    function insuredFields() {
      const e = state.errors;
      return `<div class="card-b">
        <div class="row field${e.firstName ? ' is-bad' : ''}">
          <div>First name</div>
          <div><input id="firstName" type="text" value="${state.firstName}" /><div class="err">Enter the first name as in the passport</div></div>
        </div>
        <div class="row field${e.lastName ? ' is-bad' : ''}">
          <div>Last name</div>
          <div><input id="lastName" type="text" value="${state.lastName}" /><div class="err">Enter the last name as in the passport</div></div>
        </div>
        <div class="row">
          <div>Date of birth</div>
          <div><input id="birth" type="date" value="${state.birth}" /></div>
        </div>
        <div class="row">
          <div>Passport</div>
          <div><input id="passport" type="text" value="${state.passport}" /></div>
        </div>
        <div class="row field${e.email ? ' is-bad' : ''}">
          <div>Email</div>
          <div><input id="email" type="email" value="${state.email}" /><div class="err">Enter a valid email for the policy</div></div>
        </div>
      </div>`;
    }

    function paymentBlock(amount) {
      return `<p class="warn">Payment transactions from <b>US</b> and <b>Canadian</b> bank cards may be declined by the issuing bank.</p>
        <div class="card">
          <div class="pay-item">
            <div class="pay-logo">PayPal</div>
            <div>PayPal</div>
            <div class="pay-price">${money(amount)}</div>
            <button type="button" class="btn" data-go="pay">Select</button>
          </div>
          <div class="pay-item">
            <div class="pay-logo">Card</div>
            <div>Visa / MasterCard</div>
            <div class="pay-price">${money(amount)}</div>
            <button type="button" class="btn" data-go="pay">Select</button>
          </div>
        </div>`;
    }

    function readInsured() {
      state.firstName = document.getElementById('firstName')?.value.trim() ?? state.firstName;
      state.lastName = document.getElementById('lastName')?.value.trim() ?? state.lastName;
      state.birth = document.getElementById('birth')?.value ?? state.birth;
      state.passport = document.getElementById('passport')?.value.trim() ?? state.passport;
      state.email = document.getElementById('email')?.value.trim() ?? state.email;
    }

    function validInsured() {
      state.errors = {};
      if (!state.firstName) state.errors.firstName = true;
      if (!state.lastName) state.errors.lastName = true;
      if (!/^\S+@\S+\.\S+$/.test(state.email)) state.errors.email = true;
      return Object.keys(state.errors).length === 0;
    }

    function screenA() {
      const labels = ['Information', 'Confirmation', 'Insurance', 'Payment', 'Invitation'];
      if (state.screen === 'info') {
        return `${steps(labels, 0)}
          <div class="card">
            <div class="card-h"><div class="glyph">${icCal}</div><div><h2>Length of stay and type of Visa Support</h2></div></div>
            <div class="card-b">
              <div class="row"><div>Citizenship</div><div>Australia <span class="ok">✓</span></div></div>
              <div class="row"><div>Visa type</div><div>Single-entry visa (up to 30 days) <span class="ok">✓</span></div></div>
              <div class="row"><div>Entry</div><div>${fmt(state.entry)}</div></div>
              <div class="row"><div>Exit</div><div>${fmt(state.exit)}</div></div>
            </div>
          </div>
          <div class="card">
            <div class="card-h"><div class="glyph">${icMail}</div><div><h2>Visa Support delivery methods</h2></div></div>
            <div class="card-b"><div class="row"><div>Email</div><div>${state.email} <span class="ok">✓</span></div></div></div>
          </div>
          <div class="card">
            <div class="card-h"><div class="glyph">${icUser}</div><div><h2>Visitor's information</h2></div></div>
            <div class="card-b">
              <div class="row"><div>Name</div><div>${state.firstName} ${state.lastName}</div></div>
              <div class="row"><div>Passport</div><div>${state.passport}</div></div>
            </div>
          </div>
          <div class="agree"><label><input type="checkbox" checked /> I agree with the Terms of service and Privacy Policy</label></div>
          ${actions(null, { label: 'confirm', text: 'Continue →' })}`;
      }
      if (state.screen === 'confirm') {
        return `${steps(labels, 1)}
          <div class="card"><div class="card-b">
            <p class="success-title">Please check the information</p>
            <div class="kv"><div class="k">Visa type:</div><div>Single-entry visa (up to 30 days)</div></div>
            <div class="kv"><div class="k">Dates of stay:</div><div>${stayLine()}</div></div>
            <div class="kv"><div class="k">Cities:</div><div>Moscow, Cosmos Hotel</div></div>
            <div class="kv"><div class="k">Visitor:</div><div>${state.firstName} ${state.lastName}, ${state.passport}</div></div>
            <div class="kv"><div class="k">Invitation:</div><div class="total-box"><strong>${money(INVITE)}</strong></div></div>
          </div></div>
          ${actions({ label: 'info', text: '← Change information' }, { label: 'ins', text: 'Continue to insurance →' })}`;
      }
      if (state.screen === 'ins') {
        return `${steps(labels, 2)}
          <div class="hero">
            <h1>Travel medical insurance</h1>
            <p>Most consulates ask for a policy covering the full stay. Data is copied from the invitation.</p>
          </div>
          ${tripChips()}
          <div class="card">
            <div class="card-h"><div class="glyph">${icShield}</div><div>
              <h2>Your insurance</h2>
              <p>Choose cover. You can skip and buy later.</p>
            </div></div>
            <div class="card-b">${planList()}</div>
          </div>
          <div class="card">
            <div class="card-h"><div class="glyph">${icUser}</div><div><h2>Insured person</h2></div></div>
            ${insuredFields()}
          </div>
          <div class="agree"><label><input type="checkbox" checked /> I agree with the insurance rules of Sovcombank Insurance</label></div>
          <div class="skip"><button type="button" data-go="skip">Skip insurance, pay invitation only (${money(INVITE)})</button></div>
          ${actions({ label: 'confirm', text: '← Back' }, { label: 'payScreen', text: 'Go to pay ' + money(INVITE + insPrice()) + ' →' }, 'goPay')}`;
      }
      if (state.screen === 'pay') {
        const amount = state.skip ? INVITE : INVITE + insPrice();
        return `${steps(labels, 3)}
          <div class="card"><div class="card-b total-box">
            Invitation ${money(INVITE)}${state.skip ? '' : ' + insurance ' + money(insPrice())}
            <div>To pay: <strong>${money(amount)}</strong></div>
          </div></div>
          ${paymentBlock(amount)}`;
      }
      return `${steps(labels, 4)}
        <div class="card"><div class="card-b">
          <p class="success-title">Your documents are ready</p>
          <p>Order <b>N24110817</b> of 30 Oct 2026. Files were sent to <b>${state.email}</b>.</p>
          <p><button type="button" class="btn">Download invitation</button>
          ${state.skip ? '' : ' <button type="button" class="btn ghost">Download insurance policy</button>'}</p>
          ${state.skip ? `<div class="upsell"><b>You still need medical insurance for the consulate.</b><p>Issue a Sovcombank policy for the same dates in one more step.</p><button type="button" class="btn" data-go="ins">Add insurance</button></div>` : `<ul class="list"><li>Invitation voucher</li><li>Sovcombank policy ${PLANS.find(p=>p.id===state.plan).cover}, policy No. SC-884291</li></ul>`}
        </div></div>
        <div class="actions"><button type="button" class="btn ghost" data-go="resetA">New invitation</button></div>`;
    }

    function screenB() {
      const labels = ['Information', 'Confirmation', 'Payment', 'Invitation'];
      if (state.screen === 'success') {
        return `${steps(labels, 3)}
          <div class="card"><div class="card-b">
            <p class="success-title">Payment received</p>
            <p>Invitation order <b>N24110817</b> is paid (${money(INVITE)}). The voucher is being prepared and will be emailed to <b>${state.email}</b>.</p>
            <p><button type="button" class="btn ghost">Download invitation</button></p>
            <div class="upsell">
              <b>Add travel insurance now</b>
              <p>Consulates usually ask for a medical policy covering the full stay. Dates and visitor data are already in the order.</p>
              ${tripChips()}
              ${planList()}
              <p class="total-box">Insurance to pay: <strong>${money(insPrice())}</strong></p>
              <button type="button" class="btn wide" data-go="bPay">Pay insurance ${money(insPrice())}</button>
              <div class="skip"><button type="button" data-go="bDone">No thanks, only the invitation</button></div>
            </div>
          </div></div>`;
      }
      if (state.screen === 'bPay') {
        return `<div class="card"><div class="card-h"><div><h2>Insurance payment</h2></div></div>
          <div class="card-b">
            <div class="kv"><div class="k">Insured</div><div>${state.firstName} ${state.lastName}</div></div>
            <div class="kv"><div class="k">Period</div><div>${stayLine()}</div></div>
            <div class="kv"><div class="k">Cover</div><div>${PLANS.find(p=>p.id===state.plan).cover}</div></div>
          </div></div>
          ${paymentBlock(insPrice())}`;
      }
      return `<div class="card"><div class="card-b">
        <p class="success-title">${state.paidIns ? 'Invitation and insurance are ready' : 'Invitation is ready'}</p>
        <p>Files were sent to <b>${state.email}</b>.</p>
        <p><button type="button" class="btn">Download invitation</button>
        ${state.paidIns ? ' <button type="button" class="btn ghost">Download insurance policy</button>' : ''}</p>
        ${state.paidIns ? '' : `<div class="upsell"><p>You can still buy insurance from this order later, or use the standalone form.</p></div>`}
      </div></div>`;
    }

    function screenC() {
      const labels = ['Trip', 'Cover', 'Traveler', 'Payment', 'Policy'];
      if (state.screen === 'trip') {
        return `${steps(labels, 0)}
          <div class="hero">
            <h1>Insurance for Russia</h1>
            <p>Sovcombank policy for a visa application. Territory of cover is the Russian Federation.</p>
          </div>
          ${tripBar('cover')}
          <p class="intro">Set dates and search. The electronic policy is emailed as PDF in English.</p>`;
      }
      if (state.screen === 'cover') {
        return `${steps(labels, 1)}
          ${tripChips()}
          <div class="card">
            <div class="card-h"><div class="glyph">${icShield}</div><div><h2>Choose cover</h2><p>All plans meet typical consulate requirements for a Russian visa.</p></div></div>
            <div class="card-b">${planList()}</div>
          </div>
          ${actions({ label: 'trip', text: '← Change dates' }, { label: 'traveler', text: 'Continue →' })}`;
      }
      if (state.screen === 'traveler') {
        return `${steps(labels, 2)}
          <div class="card">
            <div class="card-h"><div class="glyph">${icUser}</div><div><h2>Insured person</h2><p>Name as in the passport. The policy is issued in Latin characters.</p></div></div>
            ${insuredFields()}
          </div>
          <div class="agree"><label><input type="checkbox" checked /> I agree with the insurance rules of Sovcombank Insurance</label></div>
          ${actions({ label: 'cover', text: '← Back' }, { label: 'cPay', text: 'Go to pay ' + money(insPrice()) + ' →' }, 'goPay')}`;
      }
      if (state.screen === 'cPay') {
        return `${steps(labels, 3)}${paymentBlock(insPrice())}`;
      }
      return `${steps(labels, 4)}
        <div class="card"><div class="card-b">
          <p class="success-title">Policy issued</p>
          <p>Sovcombank policy <b>SC-884291</b> was sent to <b>${state.email}</b>. Cover ${PLANS.find(p=>p.id===state.plan).cover}, ${stayLine()}.</p>
          <p><button type="button" class="btn">Download policy PDF</button></p>
        </div></div>
        <div class="actions"><button type="button" class="btn ghost" data-go="resetC">New policy</button></div>`;
    }

    function plansOnScreen() {
      return state.screen === 'ins' || state.screen === 'success' || state.screen === 'cover';
    }

    function syncPlanDesk() {
      const on = plansOnScreen();
      const axis = document.getElementById('axis-plans');
      const group = document.getElementById('bar-plans');
      axis.classList.toggle('is-off', !on);
      group.setAttribute('aria-disabled', on ? 'false' : 'true');
      document.querySelectorAll('#bar-plans input').forEach((input) => {
        input.disabled = !on;
      });
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = state.scenario === 'a' ? screenA() : state.scenario === 'b' ? screenB() : screenC();
      bind();
      syncPlanDesk();
    }

    function go(to) {
      if (state.scenario === 'a') {
        if (to === 'resetA') { state.skip = false; state.screen = 'info'; return render(); }
        if (to === 'skip') { state.skip = true; state.screen = 'pay'; return render(); }
        if (to === 'payScreen') {
          readInsured();
          if (!validInsured()) return render();
          state.skip = false;
          state.screen = 'pay';
          return render();
        }
        if (to === 'pay') { state.screen = 'done'; return render(); }
        state.screen = to;
        return render();
      }
      if (state.scenario === 'b') {
        if (to === 'pay' || to === 'bPay') {
          if (state.screen === 'success' || to === 'bPay') { state.screen = 'bPay'; return render(); }
          state.paidIns = true;
          state.screen = 'bDone';
          return render();
        }
        if (to === 'bDone') { state.paidIns = false; state.screen = 'bDone'; return render(); }
        state.screen = to;
        return render();
      }
      if (to === 'resetC') { state.screen = 'trip'; return render(); }
      if (to === 'cPay') {
        readInsured();
        if (!validInsured()) return render();
        state.screen = 'cPay';
        return render();
      }
      if (to === 'pay') { state.screen = 'cDone'; return render(); }
      if (to === 'cover') {
        state.entry = document.getElementById('entry')?.value ?? state.entry;
        state.exit = document.getElementById('exit')?.value ?? state.exit;
      }
      state.screen = to;
      render();
    }

    function bind() {
      document.querySelectorAll('[data-go]').forEach((el) => {
        el.addEventListener('click', () => go(el.getAttribute('data-go')));
      });
      document.querySelectorAll('input[name="plan"]').forEach((el) => {
        el.addEventListener('change', () => {
          state.plan = el.value;
          readInsured();
          if (document.getElementById('entry')) state.entry = document.getElementById('entry').value;
          if (document.getElementById('exit')) state.exit = document.getElementById('exit').value;
          render();
        });
      });
      ['sport', 'luggage', 'delay'].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('change', () => {
          state[id] = el.checked;
          readInsured();
          render();
        });
      });
      document.querySelectorAll('[data-cal]').forEach((el) => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const which = el.getAttribute('data-cal');
          if (state.calOpen && state.calTarget === which) {
            state.calOpen = false;
          } else {
            state.calOpen = true;
            state.calTarget = which;
            const d = parseISO(which === 'entry' ? state.entry : state.exit);
            state.viewY = d.getFullYear();
            state.viewM = d.getMonth();
          }
          render();
        });
      });
      const cal = document.getElementById('dual-cal');
      if (cal) {
        cal.addEventListener('click', (e) => e.stopPropagation());
        cal.querySelector('[data-shift="-1"]')?.addEventListener('click', () => {
          if (state.viewM === 0) { state.viewY -= 1; state.viewM = 11; } else state.viewM -= 1;
          render();
        });
        cal.querySelector('[data-shift="1"]')?.addEventListener('click', () => {
          if (state.viewM === 11) { state.viewY += 1; state.viewM = 0; } else state.viewM += 1;
          render();
        });
        cal.querySelector('[data-year]')?.addEventListener('change', (e) => {
          state.viewY = Number(e.target.value);
          render();
        });
        cal.querySelector('[data-month]')?.addEventListener('change', (e) => {
          state.viewM = Number(e.target.value);
          render();
        });
        cal.querySelectorAll('[data-day]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const iso = btn.getAttribute('data-day');
            if (state.calTarget === 'entry') {
              state.entry = iso;
              if (state.exit < state.entry) state.exit = state.entry;
            } else {
              state.exit = iso;
              if (state.exit < state.entry) state.entry = state.exit;
            }
            state.calOpen = false;
            render();
          });
        });
      }
    }

    function setScenario(id) {
      state.scenario = id;
      state.skip = false;
      state.paidIns = false;
      state.errors = {};
      state.calOpen = false;
      state.screen = id === 'a' ? 'info' : id === 'b' ? 'success' : 'trip';
      const radio = document.querySelector('#bar-scenario input[value="' + id + '"]');
      if (radio) radio.checked = true;
      render();
      window.scrollTo(0, 0);
    }

    document.querySelectorAll('#bar-scenario input').forEach((input) => {
      input.onchange = () => setScenario(input.value);
    });
    document.querySelectorAll('#bar-plans input').forEach((input) => {
      input.onchange = () => {
        state.planUi = input.value;
        if (state.planUi === 'addons' || state.planUi === 'offer') state.plan = 'com';
        render();
      };
    });
    document.addEventListener('click', () => {
      if (!state.calOpen) return;
      state.calOpen = false;
      render();
    });
    render();
  </script>
</body>
</html>
