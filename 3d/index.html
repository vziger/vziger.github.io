<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>PDF → STL: контур в 3D</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="topbar">
  <span class="logo">▲</span>
  <h1>PDF&nbsp;→&nbsp;STL</h1>
  <span class="sub">контур в 3D-модель для печати</span>
</header>

<main>
  <aside class="panel">
    <div class="tabs">
      <button class="tab active" data-tab="pdf">📄 PDF</button>
      <button class="tab" data-tab="photo">📷 Фото</button>
    </div>

    <div class="tabpane" id="pane-pdf">
      <label class="drop" id="drop">
        <input type="file" id="file" accept="application/pdf,.pdf" hidden>
        <div class="drop-inner">
          <div class="drop-icon">⬆</div>
          <div id="dropHint">Выберите PDF или перетащите сюда</div>
        </div>
      </label>
      <details class="adv">
        <summary>Дополнительно</summary>
        <div class="field">
          <label for="tol">Точность сглаживания (меньше = глаже)</label>
          <input type="number" id="tol" value="0.15" min="0.02" max="1" step="0.01">
        </div>
      </details>
    </div>

    <div class="tabpane" id="pane-photo" hidden>
      <label class="drop" id="photoDrop">
        <input type="file" id="photoFile" accept="image/*" hidden>
        <div class="drop-inner">
          <div class="drop-icon">📷</div>
          <div id="photoHint">Сфотографируйте или выберите рисунок</div>
        </div>
      </label>
      <canvas id="photoCanvas" class="photo-canvas"></canvas>
      <p class="hint">Перетащите жёлтые углы на края листа для выпрямления.</p>
      <div class="field">
        <label for="sens">Чувствительность</label>
        <input type="range" id="sens" min="-60" max="60" value="0" step="2">
      </div>
      <div class="field">
        <label for="detail2">Детализация контура</label>
        <input type="range" id="detail2" min="0" max="100" value="50" step="5">
      </div>
      <button id="recognize" class="btn ghost">Распознать силуэт</button>
    </div>

    <div class="field">
      <label for="width">Ширина модели, мм</label>
      <input type="number" id="width" value="80" min="5" max="300" step="1">
    </div>

    <div class="field">
      <label>Режим</label>
      <div class="seg">
        <label><input type="radio" name="mode" value="solid" checked><span>Сплошная</span></label>
        <label><input type="radio" name="mode" value="relief"><span>Рельеф</span></label>
      </div>
      <p class="hint" id="modeHint">Внешний контур залит, внутренние — сквозные отверстия.</p>
    </div>

    <div class="field">
      <label for="base">Толщина базы, мм</label>
      <input type="number" id="base" value="5" min="0.4" max="100" step="0.2">
    </div>

    <div class="field" id="reliefRow">
      <label>Детали</label>
      <div class="seg">
        <label><input type="radio" name="relief" id="emboss" value="emboss" checked><span>Выступы</span></label>
        <label><input type="radio" name="relief" id="engrave" value="engrave"><span>Канавки</span></label>
      </div>
    </div>

    <div class="field" id="detailRow">
      <label for="detail">Высота деталей, мм</label>
      <input type="number" id="detail" value="1.5" min="0.2" max="50" step="0.1">
    </div>

    <div class="field">
      <label>Повернуть контур на 90°</label>
      <div class="btn-row">
        <button id="rotCCW" class="btn ghost" type="button" title="Против часовой">⟲ 90°</button>
        <button id="rotCW" class="btn ghost" type="button" title="По часовой">⟳ 90°</button>
      </div>
    </div>

    <div class="actions">
      <button id="regen" class="btn ghost">Пересобрать</button>
      <button id="download" class="btn" disabled>Скачать STL</button>
    </div>

    <div class="status" id="status">Загрузите векторный PDF-контур</div>
  </aside>

  <section class="stage">
    <canvas id="view"></canvas>
    <div class="info" id="info"></div>
  </section>
</main>

<script src="./vendor/earcut.min.js"></script>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
